# GLM5 744B, 40B Active Model
defaults:
  - _self_
  - train: musa_large

experiment:
  exp_name: glm5
  seed: 42
  save_steps: 10000
  load: null
  exp_dir: ${experiment.exp_name}
  ckpt_format: torch
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/megatron/train_gpt.py
  runner:
    per_node_task: false
    no_shared_fs: false
    rdzv_backend: static
    hostfile: null
  # cmds:
  #   before_start: ulimit -n 1048576 && source /root/miniconda3/bin/activate flagscale-train
  envs:
    # LOGLEVEL: "INFO"
    # NCCL_DEBUG: "INFO"
    # NCCL_DEBUG_SUBSYS: "ALL"
    #FLAGCX_DEBUG: "INFO"
    #FLAGCX_DEBUG_SUBSYS: "INIT,NET,BOOTSTRAP"
    #MCCL_DEBUG: "INFO"
    #MCCL_DEBUG_SUBSYS: "ALL"
    MCCL_TOPO_ENHANCE: "0"
    CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
    CUDA_DEVICE_MAX_CONNECTIONS: 1
    HYDRA_FULL_ERROR: "1"

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
