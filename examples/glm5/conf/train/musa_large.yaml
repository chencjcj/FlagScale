system:
  no_shared_fs: ${experiment.runner.no_shared_fs}
  num_workers: 2
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  expert_model_parallel_size: 8
  context_parallel_size: 1
  sequence_parallel: true
  use_distributed_optimizer: true
  # MUSA Modify: with sparse MoE (load_balancing_type "none") some experts can
  # receive zero tokens in a microbatch, so their grouped-GEMM weights get no
  # gradient. The MUSA TE backend does not emit a zero grad for empty experts,
  # which trips the overlap_grad_reduce "param.grad is None" assertion. Disable
  # the grad-reduce / param-gather overlap (perf-only optimizations) to be safe.
  overlap_grad_reduce: false
  overlap_param_gather: false
  # overlap_moe_expert_parallel_comm: true
  precision:
    bf16: true
    attention_softmax_in_fp32: true
    accumulate_allreduce_grads_in_fp32: true
  logging:
    log_interval: 1
    tensorboard_log_interval: 1
    timing-log-level: 2
    wandb_project: ${experiment.exp_name}
    wandb_exp_name: ${experiment.exp_name}
    log_timers_to_tensorboard: true
    log_validation_ppl_to_tensorboard: true
    log_throughput: true
    log_params_norm: true
    log_num_zeros_in_grad: true
    log_memory_to_tensorboard: true
  checkpoint:
    save_interval: 1000
    # pretrained_checkpoint: /nfs/lizhiyu/data/zai-org/glm5.2-small-dummy-mc
    load: ${experiment.load}
    ckpt_format: ${experiment.ckpt_format}
  profiler:
    profile: False
    profile_step_start: 4
    profile_step_end: 5
    profile_ranks: [0]
    use_pytorch_profiler: True
    pytorch_profiler_collect_shapes: True
    pytorch_profiler_collect_callstack: False
    pytorch_profiler_collect_chakra: False

model:
  # flagos
  te_fl_prefer: vendor
  enable_flag_gems: False
  flag_gems_log_path: /workspace/log/gems.log
  flag_gems_unused: ["baddbmm", "mm", "normal_", "sum_dim", "gather_backward", "index_add_", "slice_backward"]
  attention_backend: unfused
  distributed_backend: flagcx
  # common (scaled up from musa.yaml to fill 80GB S5000 memory)
  transformer_impl: transformer_engine
  num_layers: 24
  hidden_size: 2048
  num_attention_heads: 16
  num_query_groups: 16
  seq_length: 2048
  max_position_embeddings: 2048
  norm_epsilon: 1e-5
  use_rotary_position_embeddings: true
  rotary_base: 1000000
  no_rope_fusion: true
  swiglu: true
  normalization: RMSNorm
  qk_layernorm: true
  init_method_std: 0.02
  attention_dropout: 0.0
  hidden_dropout: 0.0
  position_embedding_type: rope
  untie_embeddings_and_output_weights: true
  no_position_embedding: true
  disable_bias_linear: true

  # MLA args (kept identical to parent)
  multi_latent_attention: true
  q_lora_rank: 2048
  kv_lora_rank: 512
  qk_head_dim: 192
  qk_pos_emb_head_dim: 64
  v_head_dim: 256

  # DSA args (all layers use DSA); topk reduced to match shorter seq
  experimental_attention_variant: dsa
  dsa_indexer_n_heads: 32
  dsa_indexer_head_dim: 128
  dsa_indexer_topk: 512
  dsa_indexer_loss_coeff: 0.01
  indexer_type_rule: "2*full+repeat(full, shared, shared, shared)" # GLM5/GLM5.1 is None, GLM5.2 is "2*full+repeat(full, shared, shared, shared)"

  # MoE args (scaled up)
  ffn_hidden_size: 6144
  moe_ffn_hidden_size: 1024
  moe_grouped_gemm: true
  moe_shared_expert_intermediate_size: 1024
  num_experts: 64
  moe_router_load_balancing_type: "none"
  moe_router_score_function: sigmoid
  moe_router_enable_expert_bias: true
  moe_router_bias_update_rate: 0.001
  moe_aux_loss_coeff: 0.0
  moe_layer_freq: "[0]*2+[1]*22"      # 2 dense + 22 MoE = 24 layers (must sum to num_layers)
  moe_router_num_groups: 1
  moe_router_group_topk: 1
  moe_router_topk: 8
  moe_router_topk_scaling_factor: 2.5
  moe_token_dispatcher_type: "alltoall"

  # MTP args
  mtp_num_layers: 0
  mtp_loss_scaling_factor: 0.3

  # Training
  seed: ${experiment.seed}
  finetune: false
  micro_batch_size: 1
  global_batch_size: 32
  eval_iters: 0
  eval_interval: 100
  train_iters: 1000

  optimizer:
    weight_decay: 0.1
    adam_beta1: 0.9
    adam_beta2: 0.999
    lr_scheduler:
      lr: 1.0e-5
      min_lr: 1.0e-6
      lr_warmup_fraction: .03
      # lr_warmup_iters: 10
      lr_decay_style: cosine

data:
  reset_position_ids: true
  reset_attention_mask: true
  data_path: /workspace/data/pile_wikipedia_demo
  split: 1
  no_mmap_bin_files: true
  tokenizer:
    tokenizer_type: HuggingFaceTokenizer
    tokenizer_model: /workspace/glm5-tok/
    vocab_size: 154880
    make_vocab_size_divisible_by: 64
